<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6.2" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6.2,3 L0,6 Z" fill="#3f4a56"/></marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>

  <!-- divider -->
  <line x1="500" y1="24" x2="500" y2="446" stroke="#e4e8ec" stroke-width="1"/>

  <!-- ============ BEFORE ============ -->
  <g transform="translate(0,0)">
    <text x="40" y="42" font-size="13" font-weight="600" fill="#b4232a">Before</text>
    <text x="40" y="62" font-size="11.5" fill="#5a6570">Rotated labels. Red and green encoding nothing.</text>

    <!-- user -->
    <rect x="40" y="110" width="120" height="34" rx="6" fill="#ffffff" stroke="#d3d9e0"/>
    <g transform="translate(50,119) scale(0.583)"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" fill="#263238"/></g>
    <text x="74" y="131" font-size="12" fill="#1f2933">User</text>

    <!-- firewall rotated red -->
    <path d="M160,127 L214,127" stroke="#3f4a56" stroke-width="1.3" fill="none"/>
    <rect x="214" y="95" width="30" height="64" rx="15" fill="#fdeaea" stroke="#eda9a9"/>
    <text transform="translate(233,127) rotate(-90)" text-anchor="middle" font-size="8" font-weight="700"
      font-family="ui-monospace,Menlo,Consolas,monospace" fill="#263238">FIREWALL</text>

    <!-- red dashed boundary line -->
    <line x1="229" y1="165" x2="229" y2="420" stroke="#eda9a9" stroke-width="1" stroke-dasharray="5 4"/>

    <!-- down to https rotated -->
    <path d="M244,127 L290,127 L290,196" stroke="#3f4a56" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
    <rect x="275" y="200" width="30" height="70" rx="15" fill="#ffffff" stroke="#cdd4dc"/>
    <text transform="translate(294,235) rotate(-90)" text-anchor="middle" font-size="8" font-weight="700"
      font-family="ui-monospace,Menlo,Consolas,monospace" fill="#263238">HTTPS:443</text>

    <!-- waf rotated green -->
    <path d="M290,270 L290,300" stroke="#3f4a56" stroke-width="1.3" fill="none"/>
    <rect x="275" y="300" width="30" height="60" rx="15" fill="#eef8e4" stroke="#b9dd9a"/>
    <text transform="translate(294,330) rotate(-90)" text-anchor="middle" font-size="8" font-weight="700"
      font-family="ui-monospace,Menlo,Consolas,monospace" fill="#263238">WAF</text>

    <path d="M290,360 L290,392" stroke="#3f4a56" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
    <rect x="230" y="396" width="120" height="34" rx="6" fill="#e8f1fc" stroke="#a3c2ea"/>
    <text x="290" y="417" text-anchor="middle" font-size="12" fill="#1f2933">Web UI</text>

    <!-- okta in blue (third party) -->
    <path d="M244,120 L360,120 L360,150" stroke="#3f4a56" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
    <rect x="300" y="154" width="120" height="34" rx="6" fill="#e8f1fc" stroke="#a3c2ea"/>
    <text x="360" y="175" text-anchor="middle" font-size="12" fill="#1f2933">Okta</text>

    <text x="40" y="452" font-size="10.5" fill="#b4232a">3 rotated labels · 3 hues · blue mixes Varonis and third party</text>
  </g>

  <!-- ============ AFTER ============ -->
  <g transform="translate(500,0)">
    <text x="40" y="42" font-size="13" font-weight="600" fill="#2c7a3f">After</text>
    <text x="40" y="62" font-size="11.5" fill="#5a6570">Horizontal throughout. Blue declared as ownership.</text>

    <!-- boundary -->
    <rect x="30" y="255" width="430" height="180" rx="8" fill="none" stroke="#a9b2bd" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="45" y="276" font-size="12" fill="#5a6570">Varonis cloud account</text>

    <!-- user -->
    <rect x="30" y="110" width="120" height="34" rx="6" fill="#ffffff" stroke="#d3d9e0"/>
    <g transform="translate(40,119) scale(0.583)"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" fill="#263238"/></g>
    <text x="64" y="131" font-size="12" fill="#1f2933">User</text>

    <!-- inline control: firewall (horizontal, grayscale) -->
    <path d="M150,127 L184,127" stroke="#3f4a56" stroke-width="1.3" fill="none"/>
    <rect x="184" y="109" width="96" height="36" rx="18" fill="#ffffff" stroke="#cdd4dc" stroke-width="1.5"/>
    <g transform="translate(194,119) scale(0.667)"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" fill="#263238"/></g>
    <text x="216" y="131" font-size="12" fill="#1f2933">Firewall</text>

    <!-- to okta, gray third party -->
    <path d="M280,120 L340,120 L340,150" stroke="#3f4a56" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
    <rect x="280" y="154" width="120" height="34" rx="6" fill="#f4f6f8" stroke="#d3d9e0"/>
    <text x="340" y="175" text-anchor="middle" font-size="12" fill="#1f2933">Okta</text>

    <!-- down path with horizontal connector label -->
    <path d="M232,145 L232,300" stroke="#3f4a56" stroke-width="1.3" fill="none"/>
    <rect x="196" y="200" width="72" height="18" rx="9" fill="#ffffff" stroke="#cdd4dc"/>
    <text x="232" y="212" text-anchor="middle" font-size="8" font-weight="700"
      font-family="ui-monospace,Menlo,Consolas,monospace" fill="#263238">HTTPS:443</text>

    <!-- inline control: WAF grayscale horizontal -->
    <rect x="184" y="300" width="96" height="36" rx="18" fill="#ffffff" stroke="#cdd4dc" stroke-width="1.5"/>
    <g transform="translate(196,310) scale(0.667)"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" fill="#263238"/></g>
    <text x="222" y="322" font-size="12" fill="#1f2933">WAF</text>

    <path d="M232,336 L232,372" stroke="#3f4a56" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
    <rect x="172" y="376" width="120" height="34" rx="6" fill="#e8f1fc" stroke="#a3c2ea"/>
    <text x="232" y="397" text-anchor="middle" font-size="12" fill="#1f2933">Web UI</text>

    <!-- legend -->
    <rect x="330" y="300" width="120" height="52" rx="6" fill="#ffffff" stroke="#e4e8ec"/>
    <text x="342" y="317" font-size="9" font-weight="600" fill="#5a6570">OWNERSHIP</text>
    <rect x="342" y="325" width="14" height="10" rx="2" fill="#e8f1fc" stroke="#a3c2ea"/>
    <text x="362" y="334" font-size="10" fill="#1f2933">Varonis</text>
    <rect x="342" y="339" width="14" height="10" rx="2" fill="#f4f6f8" stroke="#d3d9e0"/>
    <text x="362" y="348" font-size="10" fill="#1f2933">Third party</text>

    <text x="30" y="452" font-size="10.5" fill="#2c7a3f">0 rotated labels · 1 hue · blue means one thing</text>
  </g>
</svg>
